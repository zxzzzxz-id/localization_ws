# Configure the device for ENU output before starting; no automatic verification.
/**:
  ros__parameters:
    publish_imu: true
    publish_mag: true
    publish_temperature: true
    publish_hipnuc: true
    # HI81 synchronized UTC becomes the ROS header stamp. Invalid UTC falls
    # back to host time and is reported in /diagnostics.
    timestamp_source: device_utc
