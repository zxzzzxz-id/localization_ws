pcd_to_occupancy_map:
  ros__parameters:
    # 栅格分辨率（米）
    resolution: 0.05
    # 只把这个高度带内的点投影成障碍物（单位米，z=0 是地图原点高度）
    z_min: 0.15
    z_max: 1.0
    # 一个栅格里至少这么多点才算占据
    min_points_per_cell: 1
    # true: 没观测过的格子标 unknown(-1，灰色)，不当作可通行
    # false: 边界框内一律当空闲(0，白色)
    mark_unknown: true
    # 栅格图所在坐标系
    frame_id: "map"
    # 发布话题
    occupancy_topic: "/map"
    # 非空时把结果存成 <prefix>.pgm 和 <prefix>.yaml
    save_prefix: ""

icp_relocalizer:
  ros__parameters:
    # 先验地图降采样体素（米），作为 ICP 目标点云
    map_voxel: 0.2
    # 实时点云降采样体素（米）
    source_voxel: 0.2
    # 只取这个高度带内的点参与匹配（单位米，相对 base_link）
    z_min: -0.5
    z_max: 1.5
    # 实时点云话题（fast_lio 去畸变后的 body 系点云）
    input_topic: "/cloud_registered_body"
    # 匹配前先把点云变换到这个坐标系，ICP 结果直接就是这个坐标系的位姿
    base_frame: "base_link"
    # 输出位姿的 frame_id（fast_lio reloc 要求是 odom 或空）
    odom_frame: "odom"
    # 输出话题：fast_lio 的重定位接口
    output_topic: "/reloc/cloud_align"
    # ICP 最近邻最大距离（米）
    max_correspondence_distance: 1.0
    max_iterations: 50
    # 均方根残差超过这个值认为匹配失败，不发布结果（米）
    fitness_threshold: 0.3
    # 实时点云少于这个点数不匹配
    min_source_points: 200
    # 先攒这么多帧融合成本地子图再匹配一次（10Hz 下 30 帧 ≈ 3 秒）
    # 融合期间机器人要基本静止。设 1 = 用单帧（不推荐，容易滑）
    accumulate_frames: 30
    # 冷启动保护：启动后这段时间内不匹配，等 fast_lio 出稳定的点云（秒）
    startup_delay: 5.0
    # 地面机器人 roll/pitch 应接近 0，超过这个角度视为误匹配（度）
    max_roll_pitch_deg: 10.0
    # 相对 ICP 初值的最大净平移，超过说明匹配滑走了（米）
    max_correction_dist: 2.0
    # 用当前 odom->base_link 作为 ICP 初值（先验图与起点接近时推荐）
    use_odom_as_initial_guess: true
    # 初值上再叠加的偏移（米 / 弧度）
    initial_x: 0.0
    initial_y: 0.0
    initial_z: 0.0
    initial_yaw: 0.0
    # 匹配成功后只发布一次
    one_shot: true
    # 两次匹配之间的最小间隔（秒）
    cooldown: 3.0
    # 重定位成功后发布静态 map->odom（重定位后 odom 已对齐到先验图）
    publish_static_map_to_odom: true
