relocalign:
  ros__parameters:
    align_method: "NDTCUDA"
    voxelgrid_leaf: 0.1

    pcl_icp:
      max_iterations: 50
      max_correspondence_distance: 1.0
      transformation_epsilon: 1e-06  # 注意：某些版本YAML解析科学计数法需显式写出0
      euclidean_fitness_epsilon: 1e-06
      use_reciprocal_correspondences: true

    pcl_ndt:
      step_size: 0.1
      voxel_resolution: 1.0
      transformation_epsilon: 1e-06
      max_iterations: 40

    gicp:
      k_correspondences: 20
      max_correspondence_distance: 2.0
      num_threads: 8

    vgicp:
      k_correspondences: 20
      voxel_resolution: 1.0
      neighbor_search_method: "DIRECT1"
      num_threads: 8

    vgicp_cuda:
      k_correspondences: 20
      voxel_resolution: 1.0
      neighbor_search_method: "DIRECT1"
      neighbor_search_radius: 1.5
      nearest_neighbor_method: "GPU_RBF_KERNEL"
      kernel_width: 0.5

    ndt_cuda:
      voxel_resolution: 1.0
      neighbor_search_method: "DIRECT1"
      neighbor_search_radius: 1.5
      ndt_distance_mode: "D2D"